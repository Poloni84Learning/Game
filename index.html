<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cá Ngựa Chiến Thần</title>
  <link rel="stylesheet" href="/src/ui/style.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="gameBrand"><span class="brandSigil" aria-hidden="true"></span><span>Cá Ngựa <strong>Chiến Thần</strong></span></div>
      <span id="turnBadge">—</span>
      <span id="phaseBadge">—</span>
      <button id="btnDev" title="DevMode: ép xúc xắc" aria-label="Mở công cụ thử nghiệm">DEV</button>
    </header>
    <main id="main">
      <div id="boardWrap"><canvas id="board" aria-label="Bàn cờ Cá Ngựa Chiến Thần"></canvas></div>
      <aside id="side">
        <div id="players"></div>
        <div id="diceArea">
          <div id="dieFace">?</div>
          <button id="btnRoll" disabled>Tung xúc xắc</button>
          <div id="extraMoves"></div>
        </div>
        <h2 class="sectionTitle">Đội hình đang chơi</h2>
        <div id="pieceList"></div>
        <div id="corePanel"></div>
        <h2 class="sectionTitle">Nhật ký trận đấu</h2>
        <div id="logPanel" role="log" aria-label="Nhật ký trận đấu"></div>
      </aside>
    </main>
  </div>
  <div id="overlay" class="hidden"></div>
  <script type="module" src="/src/ui/main.ts"></script>
</body>
</html>
